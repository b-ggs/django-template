[project]
name = "django-template"
version = "0.0.0"
description = ""
requires-python = ">=3.14"
authors = [{ name = "boggs", email = "hello@boggs.xyz" }]
dependencies = [
  "celery[redis]>=5.6.3,<6",
  "dj-database-url>=3.1.2,<4",
  "django>=5.2.18,<6",
  "django-extensions>=4.1,<5",
  "django-silk>=5.6.0,<6",
  "djangorestframework>=3.18.3,<4",
  "djangorestframework-simplejwt>=5.5.1,<6",
  "drf-spectacular>=0.30.0,<1",
  "drf-standardized-errors[openapi]>=0.16.0,<0.17",
  "factory-boy>=3.3.3,<4",
  "gunicorn>=26.2.0,<27",
  "ipython>=9.17.1,<10",
  "psycopg>=3.3.6,<4",
  "sentry-sdk>=2.73.0,<3",
  "whitenoise>=6.12.0,<7",
]

[dependency-groups]
dev = [
  "detect-secrets>=1.5.0,<2",
  "django-browser-reload>=1.21.0,<2",
  "django-types>=0.24.0,<1",
  "djangorestframework-types>=0.9.0,<1",
  "djlint>=1.46.6,<2",
  "dslr>=0.6.0,<1",
  "pre-commit>=4.7.0,<5",
  "pyright>=1.1.414,<2",
  "ruff>=0.17.1,<1",
  "uv-bump>=0.6.0,<1",
  "watchdog>=6.0.0,<7",
  "werkzeug>=3.1.9,<4",
]

[tool.djlint]
# https://www.djlint.com/docs/linter/#rules
ignore = "H029,H030,H031"

[tool.ruff.lint]
select = [
  "E",  # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
  "F",  # https://docs.astral.sh/ruff/rules/#pyflakes-f
  "W",  # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
  "I",  # https://docs.astral.sh/ruff/rules/#isort-i
  "SIM",  # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
  "DJ",  # https://docs.astral.sh/ruff/rules/#flake8-django-dj
  "T10",  # https://docs.astral.sh/ruff/rules/#flake8-debugger-t10
  "S",  # https://docs.astral.sh/ruff/rules/#flake8-bandit-s
]
ignore = [
  "SIM108",  # don't recommend ternary operator
]
exclude = ["django_template/*/migrations/*.py"]

[tool.ruff.format]
exclude = ["django_template/*/migrations/*.py"]
